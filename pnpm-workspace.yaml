# Refuse package versions younger than 7 days (10080 minutes), matching Renovate.
minimumReleaseAge: 10080

# Which dependencies may run install scripts. Replaces onlyBuiltDependencies and
# ignoredBuiltDependencies, which pnpm 11 removes.
allowBuilds:
  esbuild: false
  workerd: false

overrides:
  # GHSA-wq5f-xc86-pv6w and two older libvips/libheif advisories: miniflare 4.20260623.0 (wrangler 4.104.0) pins sharp 0.34.5. Remove when miniflare requires sharp >= 0.35.5 (wrangler 4.162.0's does).
  "miniflare>sharp": "^0.35.5"
  # GHSA-4w7w-5xrc-9h26 and 22 other undici advisories: the same miniflare pins undici 7.28.0. Remove when miniflare requires undici >= 7.30.1 (wrangler 4.162.0's does).
  "miniflare>undici": "^7.30.1"
  # GHSA-g3hv-75wg-m249: typescript-estree 8.72 takes minimatch ^10, which has no fix. Remove when @typescript-eslint/typescript-estree requires minimatch >= 11.0.1 (8.73.0 does; 7 days old on 2026-11-23).
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.1"
